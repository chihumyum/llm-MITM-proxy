networks:
  net:
    name: net
    driver: bridge

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: proxy
    ports:
      - "9400:9400"
    networks:
      - net
    environment:
      - PY_SERVER_HOST=py_server
      - PY_SERVER_PORT=5000
    depends_on:
      - py_server

  py_server:
    build:
      context: .
      dockerfile: Dockerfile.py_server
    container_name: py_server
    env_file:
      - ./py_server/.env
    environment:
      - FOCUS=study networks, nothing else
      - LLM_MODEL=gpt-4o-mini
    ports:
      - "5001:5001"
    networks:
      - net

