<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Focus Filter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #667eea;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .checkbox-label {
            font-weight: 600;
            color: #555;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .status {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #555;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .success {
            color: #28a745;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YouTube Focus Filter</h1>
        <p class="subtitle">Filter YouTube recommendations based on your focus</p>
        
        <form id="configForm">
            <div class="form-group">
                <label for="focus">Focus Topics</label>
                <input type="text" id="focus" placeholder="e.g., programming, machine learning, tutorials">
            </div>
            
            <div class="form-group">
                <label for="model">LLM Model</label>
                <input type="text" id="model" value="4o-mini">
            </div>
            
            <div class="form-group">
                <div class="checkbox-group">
                    <label class="toggle">
                        <input type="checkbox" id="enabled" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="checkbox-label">Filter Enabled</span>
                </div>
            </div>
            
            <button type="submit">💾 Save Configuration</button>
        </form>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="statFiltered">0</div>
                <div class="stat-label">Videos Filtered</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statKept">0</div>
                <div class="stat-label">Videos Kept</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statDropped">0</div>
                <div class="stat-label">Videos Dropped</div>
            </div>
        </div>
        
        <div class="status">
            <div class="status-title">Current Configuration</div>
            <div id="statusContent">Loading...</div>
        </div>
    </div>

    <script>
        const API_BASE = '';  // Same origin
        
        async function loadConfig() {
            try {
                const res = await fetch(`${API_BASE}/config`);
                const data = await res.json();
                
                document.getElementById('focus').value = data.focus || '';
                document.getElementById('enabled').checked = data.enabled;
                document.getElementById('model').value = data.model || '4o-mini';
                
                document.getElementById('statusContent').textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('statusContent').textContent = 'Error loading config: ' + err.message;
            }
        }
        
        async function saveConfig(e) {
            e.preventDefault();
            
            const payload = {
                focus: document.getElementById('focus').value,
                enabled: document.getElementById('enabled').checked,
                model: document.getElementById('model').value,
            };
            
            try {
                const res = await fetch(`${API_BASE}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                
                const data = await res.json();
                document.getElementById('statusContent').innerHTML = 
                    '<span class="success">✓ Saved!</span>\n' + JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('statusContent').textContent = 'Error saving config: ' + err.message;
            }
        }
        
        document.getElementById('configForm').addEventListener('submit', saveConfig);
        
        // Load config only on page load
        loadConfig();
    </script>
</body>
</html>
